behaviors:
  CarController:
    trainer_type: sac

    hyperparameters:
      learning_rate: 0.0003        # matches PPO
      batch_size: 512             # same as PPO
      buffer_size: 10240           # same as PPO
      tau: 0.005                   # SAC default (polyak)
      steps_per_update: 1          # SAC default
      save_replay_buffer: false    # typical

    network_settings:
      normalize: false
      hidden_units: 128            # matches PPO
      num_layers: 2                # matches PPO
      vis_encode_type: simple
      deterministic: false

    reward_signals:
      extrinsic:
        gamma: 0.99                # matches PPO
        strength: 1.0
        network_settings:
          normalize: false
          hidden_units: 128        # match PPO reward network
          num_layers: 2
          vis_encode_type: simple
          deterministic: false

    keep_checkpoints: 5
    even_checkpoints: false
    max_steps: 500000              # same as PPO
    time_horizon: 64               # same as PPO
    summary_freq: 50000            # same as PPO
    threaded: false
